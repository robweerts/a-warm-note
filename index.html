<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">

  <!-- Deze redirectpagina zelf niet indexeren -->
  <meta name="robots" content="noindex,follow">

  <!-- Canonical wijst naar je default taal -->
  <link rel="canonical" href="https://awarmnote.com/nl/">

  <!-- Hreflang-hints voor Google -->
  <link rel="alternate" href="https://awarmnote.com/" hreflang="x-default">
  <link rel="alternate" href="https://awarmnote.com/nl/" hreflang="nl">
  <link rel="alternate" href="https://awarmnote.com/en/" hreflang="en">

  <title>Redirecting…</title>

  <style>
    html,body{height:100%}
    body{display:grid;place-items:center;font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,sans-serif;margin:0}
    .card{max-width:620px;padding:24px;border:1px solid #eee;border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.06)}
    .muted{color:#666}
    a{color:#111;text-decoration:underline}
  </style>

  <script>
    (function () {
      try {
        // 1) Bepaal doeltaal
        // - respecteer eerdere keuze in storage (als je language switch dat zet)
        // - anders op basis van browsertaal
        var stored = (localStorage.getItem('awn_lang') || '').toLowerCase();
        var pref = stored || (navigator.languages && navigator.languages[0]) || navigator.language || 'nl';
        var isEN = /^en\b/i.test(pref);

        // 2) Basisdoel (NL standaard)
        var target = isEN ? '/en/' : '/nl/';

        // 3) Als je al op /nl/ of /en/ staat, NIET herleiden
        if (/^\/(nl|en)\/?/.test(location.pathname)) return;

        // 4) Query + hash behouden
        var q = location.search || '';
        var h = location.hash || '';

        // 5) Redirect (history vervangen voorkomt “terug-lus”)
        location.replace(target + q + h);
      } catch (_) {}
    })();
  </script>
</head>
<body>
  <div class="card" role="status" aria-live="polite">
    <p>Je wordt doorgestuurd naar de juiste taalversie…</p>
    <p class="muted">Gaat het niet automatisch? Ga naar
      <a href="/nl/">Nederlands</a> of <a href="/en/">English</a>.</p>
  </div>

  <!-- Alleen als JS uit staat: zachte fallback naar NL -->
  <noscript>
    <meta http-equiv="refresh" content="0; url=/nl/">
  </noscript>
</body>
</html>
