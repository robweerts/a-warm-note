<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AWN POC — Fake Push Notification</title>
  <style>
    :root{
      --card-bg: rgba(255,255,255,.7);
      --card-fg: #111;
      --shadow: 0 10px 30px rgba(0,0,0,.18), 0 2px 10px rgba(0,0,0,.08);
      --ring: 0 0 0 1px rgba(0,0,0,.06) inset;
      --accent: #16a34a; /* WhatsApp-ish green */
      --muted: #6b7280;
      --radius: 16px;
    }
    @media (prefers-color-scheme: dark){
      :root{
        --card-bg: rgba(22,22,24,.7);
        --card-fg: #e6e7ea;
        --shadow: 0 10px 30px rgba(0,0,0,.4), 0 2px 10px rgba(0,0,0,.25);
        --ring: 0 0 0 1px rgba(255,255,255,.06) inset;
      }
    }

    body{
      margin:0;
      min-height:100svh;
      font: 16px/1.35 system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
      color: var(--card-fg);
      background:
        radial-gradient(1200px 600px at 10% -10%, rgba(255,215,130,.35), transparent 60%),
        radial-gradient(1200px 600px at 110% -10%, rgba(255,170,130,.25), transparent 60%),
        linear-gradient(180deg, #f7f7f8, #ececf1);
      display:grid; place-items:center;
    }
    @media (prefers-color-scheme: dark){
      body{background:
        radial-gradient(1200px 600px at 10% -10%, rgba(255,215,130,.06), transparent 60%),
        radial-gradient(1200px 600px at 110% -10%, rgba(130,170,255,.06), transparent 60%),
        linear-gradient(180deg, #0c0c10, #0f1014);
      }
    }

    /* Demo stage */
    .stage{
      display:flex; gap:20px; align-items:center; justify-content:center; flex-direction:column;
      text-align:center;
      padding:40px 20px;
    }
    .stage h1{ font-weight:700; letter-spacing:.2px; margin:0 0 6px; }
    .stage p{ margin:0 0 18px; color:var(--muted); }
    .btn{
      border:0; border-radius:999px; padding:12px 18px; cursor:pointer; font-weight:600;
      background:#111; color:#fff; box-shadow:var(--shadow);
    }
    @media (prefers-color-scheme: dark){ .btn{ background:#e6e7ea; color:#0f1014; } }

    /* Notification */
    .push{
      position: fixed;
      inset: 12px auto auto 50%;
      transform: translate(-50%, calc(-100% - 12px));
      display:flex; gap:12px; align-items:center;
      width: min(520px, calc(100vw - 24px));
      max-width: 520px;
      padding:12px 14px;
      border-radius: var(--radius);
      background: var(--card-bg);
      backdrop-filter: blur(10px) saturate(1.2);
      -webkit-backdrop-filter: blur(10px) saturate(1.2);
      color: var(--card-fg);
      box-shadow: var(--shadow); outline: none;
      border: 1px solid rgba(0,0,0,.06);
      transition: transform .5s cubic-bezier(.2,.8,.2,1), opacity .45s ease;
      opacity:0;
      z-index: 9999;
    }
    .push.is-in{ transform: translate(-50%, 0); opacity:1; }
    .push.is-out{ transform: translate(-50%, calc(-100% - 12px)); opacity:0; }

    .avatar-wrap{ position:relative; flex: 0 0 auto; }
    .avatar{
      width:48px; height:48px; border-radius:50%; object-fit:cover; display:block;
      box-shadow: var(--ring);
    }
    .wa-badge{ /* mini WhatsApp logo */
      position:absolute; right:-2px; bottom:-2px; width:18px; height:18px; border-radius:50%;
      background: var(--accent); display:grid; place-items:center; box-shadow:0 2px 6px rgba(0,0,0,.25);
      border:2px solid var(--card-bg);
    }
    .wa-badge svg{ width:12px; height:12px; display:block; fill:#fff; }

    .content{ flex:1 1 auto; min-width:0; display:grid; gap:2px; }
    .name{ font-weight:700; font-size:15px; line-height:1.1; }
    .msg{ color:var(--muted); font-size:14px; line-height:1.25; display:flex; gap:6px; align-items:center; }
    .msg .thumb{ font-size:14px; }
    .time-dot{ margin-left:auto; font-variant-numeric: tabular-nums; opacity:.6; font-size:12px; }

    .close{
      appearance:none; border:0; background:transparent; color:inherit; cursor:pointer;
      padding:6px; margin: -6px -6px -6px 6px; border-radius:10px;
    }
    .close:focus-visible{ outline:2px solid #60a5fa; outline-offset:2px; }

    /* Reduced motion */
    @media (prefers-reduced-motion: reduce){
      .push{ transition:none; }
    }
  </style>
</head>
<body>
  <div class="stage">
    <h1>AWN TestLab POC — Fake Push Notification</h1>
    <p>Simuleer een echt pushbericht met avatar + WhatsApp-badge, geluid en trilling.<br/>Klik om te testen of wacht 6 seconden na load.</p>
    <button class="btn" id="trigger">Toon Fake Push</button>
  </div>

  <!-- Notification template (cloned by JS) -->
  <template id="push-tpl">
    <aside class="push" role="status" aria-live="polite">
      <div class="avatar-wrap">
        <img class="avatar" alt="" />
        <div class="wa-badge" aria-hidden="true" title="via WhatsApp">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12.04 2C6.57 2 2.08 6.42 2.08 11.79c0 1.88.49 3.65 1.36 5.18L2 22l5.2-1.37a10.2 10.2 0 0 0 4.84 1.23c5.47 0 9.96-4.42 9.96-9.79C22 6.42 17.5 2 12.04 2Zm5.82 13.94c-.24.68-1.39 1.29-1.92 1.33-.53.05-1.07.24-3.63-.75-3.09-1.21-5.07-4.3-5.23-4.5-.16-.2-1.25-1.66-1.25-3.16 0-1.5.79-2.24 1.07-2.55.28-.3.61-.38.81-.38.2 0 .4.01.57.01.18 0 .43-.07.67.51.24.58.83 2 .9 2.14.07.14.12.31.02.5-.1.2-.15.32-.3.5-.16.18-.32.41-.46.55-.15.14-.3.3-.13.6.16.3.73 1.2 1.56 1.95 1.07.95 1.97 1.24 2.27 1.38.3.14.49.12.67-.07.18-.2.77-.88.98-1.18.21-.3.41-.25.69-.15.28.1 1.77.82 2.08.97.3.15.5.22.57.34.07.12.07.69-.17 1.37Z"/></svg>
        </div>
      </div>
      <div class="content">
        <div class="name"></div>
        <div class="msg"><span class="text"></span> <span class="thumb" aria-hidden="true">👍🏽</span><span class="time-dot">now</span></div>
      </div>
      <button class="close" aria-label="Sluiten" title="Sluiten">✕</button>
    </aside>
  </template>

  <script>
    // Lightweight audio ping using Web Audio API (no external assets)
    async function playPing(){
      try{
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const o = ctx.createOscillator();
        const g = ctx.createGain();
        o.type = 'sine';
        o.frequency.setValueAtTime(880, ctx.currentTime);
        g.gain.setValueAtTime(0.0001, ctx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.15, ctx.currentTime + 0.01);
        g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.25);
        o.connect(g).connect(ctx.destination);
        o.start();
        o.stop(ctx.currentTime + 0.26);
        // auto-close context soon after
        setTimeout(()=>ctx.close(), 350);
      }catch(e){ /* ignore */ }
    }

    function vibratePattern(){
      if (navigator.vibrate){
        // short-double buzz pattern
        navigator.vibrate([80, 50, 80]);
      }
    }

    function showFakePush({
      name = 'Mila (AI)',
      message = 'New: AI Compose is live — write a warm note in seconds!',
      avatarUrl = ''
    }={}){
      const tpl = document.getElementById('push-tpl');
      const node = tpl.content.firstElementChild.cloneNode(true);
      const img = node.querySelector('.avatar');
      const nm  = node.querySelector('.name');
      const tx  = node.querySelector('.msg .text');
      const closeBtn = node.querySelector('.close');

      nm.textContent = name;
      tx.textContent = message;

      if (avatarUrl){
        img.src = avatarUrl;
        img.alt = name;
      } else {
        // fallback: generate a simple placeholder avatar via SVG data URI (initials-like)
        const initials = (name||'?').split(/\s+/).map(w=>w[0]).slice(0,2).join('').toUpperCase();
        const svg = encodeURIComponent(`<?xml version='1.0' encoding='UTF-8'?>
          <svg xmlns='http://www.w3.org/2000/svg' width='96' height='96' viewBox='0 0 96 96'>
            <defs>
              <linearGradient id='g' x1='0' y1='0' x2='1' y2='1'>
                <stop offset='0%' stop-color='#f7c774'/>
                <stop offset='100%' stop-color='#ef7b7b'/>
              </linearGradient>
            </defs>
            <rect rx='48' ry='48' width='96' height='96' fill='url(#g)'/>
            <text x='50%' y='54%' dominant-baseline='middle' text-anchor='middle' font-family='system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial' font-size='34' fill='white' font-weight='700'>${initials}</text>
          </svg>`);
        img.src = `data:image/svg+xml;charset=utf-8,${svg}`;
        img.alt = initials;
      }

      // remove when user clicks X or the card
      const close = ()=>{
        node.classList.add('is-out');
        setTimeout(()=> node.remove(), 460);
      };
      closeBtn.addEventListener('click', (e)=>{ e.stopPropagation(); close(); });
      node.addEventListener('click', ()=>{
        // In real app: open AI Compose panel
        alert('AI Compose • Coming Soon');
        close();
      });

      document.body.appendChild(node);

      // enter animation (next tick)
      requestAnimationFrame(()=> node.classList.add('is-in'));

      // haptics + sound
      playPing();
      vibratePattern();

      // auto dismiss
      setTimeout(close, 5200);
    }

    // Demo trigger button
    document.getElementById('trigger').addEventListener('click', ()=>{
      showFakePush({
        name: 'Mila (AI)',
        message: 'I wrote a lovely note for Ria. Want to see it?',
        avatarUrl: '' // put a real face url here for extra realism
      });
    });

    // Auto show after 6s on load (to simulate surprise)
    window.addEventListener('load', ()=>{
      setTimeout(()=>{
        showFakePush({
          name: 'Alex (AI)',
          message: 'New: AI Compose — craft warm notes instantly on awarmnote.com',
        });
      }, 6000);
    });
  </script>
</body>
</html>
